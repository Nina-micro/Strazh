<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СТРАЖ — отдел ПЭО</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
    padding: 16px;
    max-width: 640px;
    margin: 0 auto;
  }
  h1 { font-size: 26px; text-align: center; margin-top: 8px; }
  .subtitle { text-align: center; color: #64748b; margin-bottom: 16px; }
  .tabs {
    display: flex;
    background: #e2e8f0;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .tabs button {
    flex: 1;
    padding: 10px;
    border: none;
    background: none;
    color: #475569;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
  }
  .tabs button.on { background: #2563eb; color: #fff; }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .card h3 { font-size: 17px; margin-bottom: 12px; }
  .card h4 { font-size: 14px; margin: 12px 0 8px; color: #475569; }
  .counters { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; text-align: center; }
  .counter .num { font-size: 22px; font-weight: 700; }
  .counter .lbl { font-size: 11px; color: #64748b; }
  .num.c-black  { color: #1e293b; }
  .num.c-blue   { color: #2563eb; }
  .num.c-orange { color: #f59e0b; }
  .num.c-red    { color: #ef4444; }
  .num.c-green  { color: #16a34a; }
  label { display: block; font-size: 14px; margin-bottom: 8px; }
  input, select {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
  }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 11px;
    margin-top: 10px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:active { background: #1d4ed8; }
  .task {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid #e2e8f0;
    font-size: 14px;
    gap: 8px;
  }
  .task:last-child { border-bottom: none; }
  .task .info { flex: 1; }
  .task .name { font-weight: 600; }
  .task .meta { color: #64748b; font-size: 12px; margin-top: 2px; }
  .del {
    background: none;
    border: none;
    color: #ef4444;
    font-size: 18px;
    cursor: pointer;
  }
  .hr { border: none; border-top: 1px solid #e2e8f0; margin: 10px 0; }
  #res p { font-size: 14px; margin: 4px 0; }
  .note { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 4px; }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>СТРАЖ</h1>
<p class="subtitle">Отдел ПЭО · задачи и дедлайны</p>

<div class="tabs">
  <button id="tabTasks" class="on" onclick="showTab('tasks')">Задачи</button>
  <button id="tabCalc" onclick="showTab('calc')">Калькулятор</button>
</div>

<!-- ===== РАЗДЕЛ: Задачи ===== -->
<div id="secTasks">

  <div class="card">
    <div class="counters">
      <div class="counter"><div class="num" id="cAll">0</div><div class="lbl">всего</div></div>
      <div class="counter"><div class="num" id="cWork">0</div><div class="lbl">в работе</div></div>
      <div class="counter"><div class="num" id="cSoon">0</div><div class="lbl">скоро дедлайн</div></div>
      <div class="counter"><div class="num" id="cOver">0</div><div class="lbl">просрочено</div></div>
      <div class="counter"><div class="num" id="cDone">0</div><div class="lbl">закрыто</div></div>
    </div>
  </div>

  <div class="card">
    <h3>Новая задача</h3>
    <label>Название <input type="text" id="tName" placeholder="Например: РКМ - изделие - ХХХП; ДС - ХХХП; НР - месяц.год"></label>
    <label>Исполнитель
      <select id="tWho" onchange="toggleCustomWho()"></select>
    </label>
    <label id="tWhoCustomWrap" class="hidden">Свой вариант <input type="text" id="tWhoCustom" placeholder="имя"></label>
    <label>Дедлайн <input type="date" id="tDate"></label>
    <button class="btn" onclick="addTask()">Добавить</button>
  </div>

  <div class="card">
    <h3>Задачи</h3>
    <div id="taskList"><p class="note">Задач пока нет</p></div>
  </div>

  <p class="note">ВНИМАНИЕ. ТЕСТОВЫЙ РЕЖИМ. Задачи хранятся только на этом устройстве — переноси в Kaiten.</p>

</div>

<!-- ===== РАЗДЕЛ: Калькулятор ===== -->
<div id="secCalc" class="hidden">

  <div class="card">
    <h3>Калькулятор затрат (ПЭО)</h3>

    <h4>Материалы</h4>
    <label>Ф4 — материалы, руб. <input type="number" id="f4" step="0.01"></label>
    <label>Ф6 — ПКИ, руб. <input type="number" id="f6" step="0.01"></label>
    <label>Ф7 — услуги сторонних организаций, руб. <input type="number" id="f7" step="0.01"></label>

    <h4>Заработная плата</h4>
    <label>Средняя ЗП (норматив), руб./мес. <input type="number" id="avg" step="0.01"></label>
    <label>Трудоёмкость <input type="number" id="labor" step="0.1">
      <select id="unit">
        <option value="mm">чел./мес.</option>
        <option value="h">часы</option>
      </select>
    </label>
    <label>Часов в чел./мес. <input type="number" id="hpm" value="164" step="0.1"></label>
    <label>ДЗП (Ф10), % от основной ЗП <input type="number" id="dzp" step="0.1"></label>
    <label>СТРАХ, % от ЗП всего <input type="number" id="strah" step="0.1"></label>

    <h4>Накладные расходы</h4>
    <label>ОПР (Ф11), % от ЗП всего <input type="number" id="opr" step="0.1"></label>
    <label>ОХР/АУР (Ф12), % от ЗП всего <input type="number" id="ohr" step="0.1"></label>

    <button class="btn" onclick="calc()">Рассчитать</button>
    <div id="res"></div>
  </div>

</div>

<script>
// ===== СПИСОК ИСПОЛНИТЕЛЕЙ =====
// Впишите сюда фамилии через запятую — они появятся в выпадающем списке:
const TEAM = ['Нина', 'Аня', 'Маша', 'Вика', 'Алина'];

// ===== Переключение разделов =====
function showTab(name) {
  document.getElementById('secTasks').classList.toggle('hidden', name !== 'tasks');
  document.getElementById('secCalc').classList.toggle('hidden', name !== 'calc');
  document.getElementById('tabTasks').classList.toggle('on', name === 'tasks');
  document.getElementById('tabCalc').classList.toggle('on', name === 'calc');
}

// ===== Исполнитель: сборка списка =====
function buildWhoSelect() {
  const sel = document.getElementById('tWho');
  let html = '<option value="">— не выбран —</option>';
  TEAM.forEach(t => { html += '<option value="' + t + '">' + t + '</option>'; });
  html += '<option value="__other">Другое…</option>';
  sel.innerHTML = html;
}
function toggleCustomWho() {
  const isOther = document.getElementById('tWho').value === '__other';
  document.getElementById('tWhoCustomWrap').classList.toggle('hidden', !isOther);
}

// ===== Задачи =====
function loadTasks() {
  try { return JSON.parse(localStorage.getItem('strazh_tasks')) || []; }
  catch(e) { return []; }
}
function saveTasks(tasks) {
  localStorage.setItem('strazh_tasks', JSON.stringify(tasks));
}
function fmtDate(s) {
  if (!s) return '';
  return new Date(s).toLocaleDateString('ru-RU');
}
function daysLeft(s) {
  if (!s) return null;
  const d = new Date(s);
  const now = new Date();
  d.setHours(23,59,59,0);
  return Math.ceil((d - now) / 86400000);
}
function render() {
  const tasks = loadTasks();
  let all = 0, work = 0, soon = 0, over = 0, done = 0;

  tasks.forEach(t => {
    if (t.status === 'done') { done++; return; }
    all++;
    const left = daysLeft(t.date);
    if (left !== null && left < 0) over++;
    else if (left !== null && left <= 3) soon++;
    else work++;
  });

  const setCounter = (id, val, cls) => {
    const el = document.getElementById(id);
    el.textContent = val;
    el.className = 'num ' + cls;
  };
  setCounter('cAll',  all + done, 'c-black');
  setCounter('cWork', work, 'c-blue');
  setCounter('cSoon', soon, 'c-orange');
  setCounter('cOver', over, 'c-red');
  setCounter('cDone', done, 'c-green');

  const list = document.getElementById('taskList');
  if (!tasks.length) {
    list.innerHTML = '<p class="note">Задач пока нет</p>';
    return;
  }
  list.innerHTML = tasks.map((t, i) => {
    const left = daysLeft(t.date);
    let badge = '';
    if (t.status !== 'done' && left !== null) {
      if (left < 0) badge = ' — <b style="color:#ef4444">просрочено</b>';
      else if (left <= 3) badge = ' — <b style="color:#f59e0b">дедлайн: ' + left + ' дн.</b>';
      else badge = ' — дедлайн через ' + left + ' дн.';
    }
    const check = t.status === 'done' ? '✅ ' : '';
    return '<div class="task">' +
      '<div class="info"><div class="name">' + check + t.name +
      (t.who ? ' · ' + t.who : '') + badge + '</div>' +
      '<div class="meta">' + (t.date ? fmtDate(t.date) : '') + '</div></div>' +
      '<div>' +
      (t.status !== 'done' ? '<button class="del" title="Закрыть" onclick="closeTask(' + i + ')">✓</button>' : '') +
      '<button class="del" title="Удалить" onclick="delTask(' + i + ')">✕</button>' +
      '</div></div>';
  }).join('');
}
function addTask() {
  const name = document.getElementById('tName').value.trim();
  if (!name) { alert('Введите название задачи'); return; }

  let who = document.getElementById('tWho').value;
  if (who === '__other') {
    who = document.getElementById('tWhoCustom').value.trim();
    if (!who) { alert('Впишите исполнителя или выберите из списка'); return; }
  }

  const tasks = loadTasks();
  tasks.unshift({
    name: name,
    who: who,
    date: document.getElementById('tDate').value,
    status: 'work'
  });
  saveTasks(tasks);
  document.getElementById('tName').value = '';
  document.getElementById('tWho').value = '';
  document.getElementById('tWhoCustom').value = '';
  document.getElementById('tWhoCustomWrap').classList.add('hidden');
  document.getElementById('tDate').value = '';
  render();
}
function closeTask(i) {
  const tasks = loadTasks();
  tasks[i].status = 'done';
  saveTasks(tasks);
  render();
}
function delTask(i) {
  const tasks = loadTasks();
  tasks.splice(i, 1);
  saveTasks(tasks);
  render();
}
buildWhoSelect();
render();

// ===== Калькулятор =====
function fmt(x) {
  return x.toLocaleString('ru-RU', {maximumFractionDigits: 2}) + ' руб.';
}
function calc() {
  const v = id => parseFloat(document.getElementById(id).value) || 0;

  const materials = v('f4') + v('f6') + v('f7');

  const hpm = v('hpm') || 164;
  const manMonths = document.getElementById('unit').value === 'h'
    ? v('labor') / hpm
    : v('labor');

  const f9 = v('avg') * manMonths;         // основная ЗП
  const f10 = f9 * v('dzp') / 100;         // ДЗП
  const salary = f9 + f10;                 // ЗП всего
  const strah = salary * v('strah') / 100; // страховые взносы
  const f11 = salary * v('opr') / 100;     // ОПР
  const f12 = salary * v('ohr') / 100;     // ОХР/АУР

  // Себестоимость (включая СТРАХ)
  const seb = materials + salary + strah + f11 + f12;

  // Прибыль: 1% от материалов всего, 25% от остальных статей
  const profitMaterials = materials * 0.01;
  const profitOther = (salary + strah + f11 + f12) * 0.25;
  const profit = profitMaterials + profitOther;

  const price = seb + profit;

  document.getElementById('res').innerHTML =
    '<hr class="hr">' +
    '<p>Материалы всего: <b>' + fmt(materials) + '</b></p>' +
    '<p>Ф9 — основная ЗП: ' + fmt(f9) + '</p>' +
    '<p>Ф10 — ДЗП: ' + fmt(f10) + '</p>' +
    '<p>ЗП всего: <b>' + fmt(salary) + '</b></p>' +
    '<p>СТРАХ: ' + fmt(strah) + '</p>' +
    '<p>Ф11 — ОПР: ' + fmt(f11) + '</p>' +
    '<p>Ф12 — ОХР/АУР: ' + fmt(f12) + '</p>' +
    '<hr class="hr">' +
    '<p>СЕБ — себестоимость: <b>' + fmt(seb) + '</b></p>' +
    '<p>Прибыль: <b>' + fmt(profit) + '</b>' +
    ' <span class="note">(1% от материалов: ' + fmt(profitMaterials) +
    ' · 25% от остальных: ' + fmt(profitOther) + ')</span></p>' +
    '<hr class="hr">' +
    '<p style="font-size:17px">ЦЕНА БЕЗ НДС: <b>' + fmt(price) + '</b></p>';
}
</script>

</body>
</html>
